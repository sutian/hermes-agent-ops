name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "agent/**"
      - "monitoring/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: "production"

env:
  LOG_SERVER_HOST: ${{ secrets.LOG_SERVER_HOST }}
  HERMES_HOST: ${{ secrets.HERMES_HOST }}

jobs:
  deploy-log-server:
    name: Deploy Log Server
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull images
        run: |
          docker compose -f docker/docker-compose.yml pull

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LOG_SERVER_HOST }}
          username: ${{ secrets.LOG_SERVER_USER }}
          key: ${{ secrets.LOG_SERVER_SSH_KEY }}
          script: |
            cd hermes-agent-ops
            git pull origin main
            docker compose -f docker/docker-compose.yml up -d
            docker compose -f docker/docker-compose.yml logs --tail=50

  deploy-vector-agent:
    name: Deploy Vector Agent
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Vector Agent
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HERMES_HOST }}
          username: ${{ secrets.HERMES_USER }}
          key: ${{ secrets.HERMES_SSH_KEY }}
          script: |
            # Copy vector config
            scp -o StrictHostKeyChecking=no agent/vector.toml ${{ secrets.HERMES_USER }}@${{ secrets.HERMES_HOST }}:/tmp/vector.toml

            # Restart vector service
            ssh -o StrictHostKeyChecking=no ${{ secrets.HERMES_USER }}@${{ secrets.HERMES_HOST }} \
              "sudo mv /tmp/vector.toml /etc/vector/vector.toml && sudo systemctl restart vector-agent"

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-log-server, deploy-vector-agent]
    steps:
      - name: Check Loki
        run: |
          curl -sf http://${{ secrets.LOG_SERVER_HOST }}:3100/ready || exit 1

      - name: Check Grafana
        run: |
          curl -sf http://${{ secrets.LOG_SERVER_HOST }}:3001/api/health || exit 1

      - name: Report success
        run: echo "Deployment verified successfully"

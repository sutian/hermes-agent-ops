groups:
  - name: loki_alerts
    interval: 30s
    rules:
      - alert: LokiProcessTooManyRestarts
        expr: process_restart_total > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Loki process restarted multiple times"

      - alert: LokiHighErrorRate
        expr: sum(rate(loki_request_duration_seconds_count{status=~"5.."}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Loki high error rate"

      - alert: LokiRequestLatencyHigh
        expr: histogram_quantile(0.99, sum(rate(loki_request_duration_seconds_bucket[5m])) by (le)) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Loki request latency > 5s (p99)"

      - alert: LokiDiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Log server disk space < 10%"
